<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Bebas+Neue&family=Pacifico&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root { --ease: cubic-bezier(.2,.8,.2,1); --gl: transparent; --gt: transparent; --gr: transparent; --gb: transparent; --accent: #0a84ff; }
:root[data-theme="light"] {
  --bg1:#f4f6fa; --bg2:#dce2eb; --blob1:#c6d6f2; --blob2:#f3dac6; --blob3:#d4eaee;
  --text:#1d1d1f; --text2:#6e6e73; --text3:#a1a1a6;
  --glass:rgba(255,255,255,.5); --stroke:rgba(255,255,255,.8);
  --tile:rgba(255,255,255,.6); --tile-focus:#fff;
  --shadow:rgba(40,52,80,.16); --shadow-strong:rgba(30,40,70,.34);
  --panel:rgba(246,247,250,.92); --scrim:rgba(20,24,32,.3);
  --pos:#1f9d55; --invert:#fff;
}
:root[data-theme="dark"] {
  --bg1:#0d0e13; --bg2:#171922; --blob1:#1b2745; --blob2:#33202d; --blob3:#0f2a2b;
  --text:#f5f5f7; --text2:#98989f; --text3:#5c5c63;
  --glass:rgba(255,255,255,.06); --stroke:rgba(255,255,255,.08);
  --tile:rgba(255,255,255,.08); --tile-focus:rgba(255,255,255,.24);
  --shadow:rgba(0,0,0,.45); --shadow-strong:rgba(0,0,0,.75);
  --panel:rgba(30,31,38,.94); --scrim:rgba(0,0,0,.5);
  --pos:#30d158; --invert:#111;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  font-family: Inter, -apple-system, "SF Pro Display", "Segoe UI", sans-serif;
  background: radial-gradient(ellipse at 50% 115%, #3b2b1d 0%, #16120e 60%, #0c0a08 100%);
  -webkit-font-smoothing: antialiased;
}
body.noframe { background: #000; }
button { font-family: inherit; cursor: pointer; }

/* ---------- Ambilight (pré-visualização na parede) ---------- */
#glow { position: fixed; pointer-events: none; transition: opacity .8s; }
#glow i { position: absolute; border-radius: 50%; filter: blur(70px); transition: background 1.2s; }
#glow .gl { left: -9%; top: 4%; width: 22%; height: 92%; background: var(--gl); }
#glow .gr { right: -9%; top: 4%; width: 22%; height: 92%; background: var(--gr); }
#glow .gt { left: 4%; top: -16%; width: 92%; height: 32%; background: var(--gt); }
#glow .gb { left: 4%; bottom: -12%; width: 92%; height: 24%; background: var(--gb); }
#glow[data-mode="lounge"] { animation: hue 16s linear infinite; }
#glow[data-mode="audio"] i { animation: pulse .9s ease-in-out infinite alternate; }
#glow[data-mode="audio"] .gr { animation-delay: .3s; }
#glow[data-mode="audio"] .gt { animation-delay: .5s; }
@keyframes hue { to { filter: hue-rotate(360deg); } }
@keyframes pulse { from { opacity: .45; transform: scale(.92); } to { opacity: 1; transform: scale(1.05); } }
body.noframe #glow, body.noframe #hint { display: none; }

#hint {
  position: fixed; left: 0; right: 0; bottom: 14px; text-align: center;
  color: rgba(255,255,255,.45); font-size: 13px; letter-spacing: .01em;
}
#hint kbd {
  font-family: inherit; font-size: 12px; padding: 2px 7px; border-radius: 6px;
  background: rgba(255,255,255,.1); color: rgba(255,255,255,.75); margin: 0 3px;
}

/* ---------- Tela (1920×1080, escalada) ---------- */
#stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
  transform-origin: 0 0; overflow: hidden; border-radius: 8px;
  box-shadow: 0 0 0 12px #050505, 0 40px 90px rgba(0,0,0,.7);
  color: var(--text);
}
body.noframe #stage { box-shadow: none; border-radius: 0; }
.screen { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(160deg, var(--bg1), var(--bg2)); transition: background .6s; }
.blobs i { position: absolute; border-radius: 50%; filter: blur(150px); transition: background .6s, opacity .6s; }
.blobs .b1 { width: 900px; height: 700px; left: -200px; top: -250px; background: var(--blob1); }
.blobs .b2 { width: 800px; height: 700px; right: -200px; top: 200px; background: var(--blob2); }
.blobs .b3 { width: 900px; height: 600px; left: 500px; bottom: -350px; background: var(--blob3); }
.screen[data-bg="liso"] .blobs { display: none; }
.screen[data-bg="vivo"] .blobs i { filter: blur(110px); }
.screen[data-bg="vivo"] .blobs .b3 { background: color-mix(in srgb, var(--accent) 55%, transparent); }
.screen[data-bg="vivo"] .blobs .b1 { background: color-mix(in srgb, var(--accent) 30%, var(--blob1)); }

#content { position: relative; padding: 76px 120px 0; transition: transform .6s var(--ease); }
#header, .block { transition: opacity .45s; }
.off { opacity: 0; }
.block + .block { margin-top: 40px; }
#header + #blocks > .block:first-child { margin-top: 0; }

.f { outline: none; transition: transform .28s var(--ease), box-shadow .28s var(--ease), background .2s, color .2s, opacity .2s; }
html[data-motion="reduzidas"] .f, html[data-motion="reduzidas"] #content { transition-duration: .08s; }

/* Cabeçalho */
#header { display: flex; justify-content: space-between; align-items: flex-start; min-height: 176px; }
h1 { font-size: 78px; font-weight: 700; letter-spacing: -.025em; margin: 0; line-height: 1; }
.tabs { display: flex; gap: 6px; margin: 22px 0 0 -18px; }
.tab { font-size: 28px; font-weight: 500; color: var(--text2); padding: 10px 20px; border-radius: 999px; background: transparent; border: 0; }
.tab.active { color: var(--text); font-weight: 600; }
.tab:focus { background: var(--tile-focus); color: var(--text); transform: scale(1.08); box-shadow: 0 14px 30px -10px var(--shadow-strong); }
.right { display: flex; flex-direction: column; align-items: flex-end; gap: 18px; }
.icons { display: flex; gap: 16px; }
.ibtn {
  width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center;
  background: var(--glass); border: 1px solid var(--stroke); color: var(--text);
  backdrop-filter: blur(20px); box-shadow: 0 8px 20px -10px var(--shadow);
}
.ibtn svg { width: 30px; height: 30px; }
.ibtn:focus { transform: scale(1.18); background: var(--tile-focus); box-shadow: 0 18px 34px -10px var(--shadow-strong); }
.status { display: flex; align-items: center; gap: 18px; color: var(--text2); font-size: 23px; font-weight: 500; }
.status .clock { font-size: 30px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
.wmini { display: flex; align-items: center; gap: 6px; }
.wmini svg { width: 30px; height: 30px; color: var(--text2); }
#date::first-letter { text-transform: uppercase; }

/* Destaques */
.hero { display: flex; gap: 40px; height: 534px; }
.card { display: flex; flex-direction: column; gap: 18px; }
.card.feature { width: 1000px; }
.card.poster { width: 300px; }
.art {
  position: relative; height: 440px; width: 100%; padding: 0; border: 0; border-radius: 28px; overflow: hidden;
  box-shadow: 0 18px 40px -18px var(--shadow);
}
.art::after { content: ""; position: absolute; inset: 0; z-index: 2; background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,.5)); }
.art:focus { transform: scale(1.06) translateY(-8px); box-shadow: 0 44px 70px -22px var(--shadow-strong); z-index: 3; }
.feature .art:focus { transform: scale(1.03) translateY(-8px); }
.art:focus::before { content: ""; position: absolute; inset: 0; z-index: 4; background: linear-gradient(115deg, rgba(255,255,255,.3), transparent 38%); }
.sil { position: absolute; left: 0; bottom: 0; width: 100%; z-index: 1; }
.sil.s1 { height: 58%; fill: rgba(0,0,0,.22); }
.sil.s2 { height: 40%; fill: rgba(0,0,0,.38); }
.art-title {
  position: absolute; left: 40px; right: 40px; bottom: 36px; z-index: 3; text-align: left;
  font: 700 66px/1 "Playfair Display", Georgia, serif; color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,.4);
}
.poster .art-title { font-size: 40px; left: 26px; right: 26px; bottom: 28px; }
.art-badge {
  position: absolute; top: 28px; left: 32px; z-index: 3; font-size: 20px; font-weight: 600; color: #fff;
  padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,.18); backdrop-filter: blur(12px);
}
.cap b { font-size: 28px; font-weight: 600; letter-spacing: -.01em; }
.cap small { display: block; font-size: 22px; color: var(--text2); margin-top: 6px; }

/* Barra de apps */
.dock {
  padding: 12px 0; border-radius: 46px;
  background: var(--glass); border: 1px solid var(--stroke);
  backdrop-filter: blur(30px) saturate(1.5); box-shadow: 0 24px 50px -24px var(--shadow);
}
.dock-vp { overflow: hidden; padding: 16px 30px; --fl: 0px; --fr: 0px; }
.dock-vp.more-l { --fl: 110px; }
.dock-vp.more-r { --fr: 110px; }
.dock-vp.more-l, .dock-vp.more-r {
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 var(--fl), #000 calc(100% - var(--fr)), transparent);
  mask-image: linear-gradient(90deg, transparent, #000 var(--fl), #000 calc(100% - var(--fr)), transparent);
}
.dock-track { position: relative; display: flex; gap: 24px; transition: transform .45s var(--ease); }
html[data-motion="reduzidas"] .dock-track { transition-duration: .1s; }
.tile {
  width: 181px; height: 110px; flex: none; border: 0; border-radius: 24px; position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 10px 24px -12px rgba(0,0,0,.4);
}
.tile:focus { transform: scale(1.13) translateY(-6px); box-shadow: 0 30px 50px -14px var(--shadow-strong); z-index: 2; }
.tile:focus::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.35), transparent 42%); }
.a-tv { background: linear-gradient(160deg, #474c59, #1c1f26); color: #fff; font-size: 23px; font-weight: 700; letter-spacing: -.01em; }
.a-tv svg, .a-br svg { width: 30px; height: 30px; }
.a-yt { background: #fff; color: #0f0f0f; gap: 6px; }
.yt-play { width: 40px; height: 28px; background: #ff0033; border-radius: 8px; position: relative; }
.yt-play::after { content: ""; position: absolute; left: 16px; top: 7px; border-left: 11px solid #fff; border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
.yt-t { font-size: 27px; font-weight: 700; letter-spacing: -.05em; }
.a-prime { background: linear-gradient(160deg, #1fa6ff, #0b6fc0); color: #fff; }
.pv { display: flex; flex-direction: column; align-items: center; }
.pv span { font-size: 25px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.pv svg { width: 92px; height: 14px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.a-nf { background: #000; color: #e50914; font: 400 54px "Bebas Neue", Impact, sans-serif; letter-spacing: .02em; padding-top: 4px; }
.a-hbo { background: linear-gradient(150deg, #1d1ab8, #5a2ad4 60%, #7d3cf2); color: #fff; }
.hbo { display: flex; flex-direction: column; align-items: center; line-height: .82; }
.hbo b { font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
.hbo i { font-size: 31px; font-weight: 700; font-style: normal; letter-spacing: -.04em; }
.a-cr { background: #f47521; color: #fff; font-size: 23px; font-weight: 700; letter-spacing: -.03em; gap: 7px; }
.cr-logo { width: 30px; height: 30px; border-radius: 50%; flex: none; background: radial-gradient(circle at 64% 38%, #f47521 0 30%, transparent 31%), #fff; }
.a-atv { background: #0b0b0c; color: #fff; font-size: 42px; font-weight: 600; letter-spacing: -.04em; gap: 2px; }
.a-atv svg { width: 36px; height: 36px; fill: #fff; margin-bottom: 7px; }
.a-dis { background: linear-gradient(160deg, #0a1a5c, #1c3e9e); color: #fff; font: 400 34px Pacifico, cursive; }
.a-dis sup { font-family: Inter, sans-serif; font-weight: 500; font-size: 26px; margin-left: 2px; }
.a-glb { background: linear-gradient(135deg, #ff6a3d, #ef1d3a); color: #fff; font-size: 27px; font-weight: 700; letter-spacing: -.04em; }
.a-sp { background: #121212; color: #fff; font-size: 25px; font-weight: 700; letter-spacing: -.03em; }
.sp-dot { width: 30px; height: 30px; border-radius: 50%; background: #1ed760; flex: none; }
.a-tw { background: #9146ff; color: #fff; font-size: 32px; font-weight: 800; letter-spacing: -.03em; }
.a-px { background: #1f1f1f; color: #fff; font-size: 38px; font-weight: 700; letter-spacing: -.03em; }
.a-px b { color: #e5a00d; }
.a-ko { background: linear-gradient(160deg, #17b2e7, #0f6fa8); color: #fff; font-size: 32px; font-weight: 800; letter-spacing: .08em; }
.a-br { background: linear-gradient(160deg, #4a5466, #2a303b); color: #fff; font-size: 22px; font-weight: 600; }
.a-ps { background: #fff; color: #01875f; font-size: 24px; font-weight: 700; letter-spacing: -.02em; }

/* Entradas e atalhos */
.row2 { display: flex; gap: 48px; }
.group h3 { margin: 0 0 16px 6px; font-size: 24px; font-weight: 500; color: var(--text2); }
.chips { display: flex; gap: 16px; }
.chip {
  width: 150px; height: 114px; border-radius: 24px; position: relative;
  border: 1px solid var(--stroke); background: var(--tile); color: var(--text); backdrop-filter: blur(20px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px;
  font-size: 21px; font-weight: 500; box-shadow: 0 10px 24px -16px var(--shadow);
}
.chip span { max-width: 132px; text-align: center; line-height: 1.15; }
.chip svg { width: 32px; height: 32px; }
.chip small { font-size: 15px; color: var(--text2); margin-top: -7px; }
.chip.dim { opacity: .42; }
.chip.active::before { content: ""; position: absolute; top: 13px; right: 14px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.chip:focus { transform: scale(1.12) translateY(-4px); background: var(--tile-focus); opacity: 1; box-shadow: 0 26px 44px -14px var(--shadow-strong); z-index: 2; }

/* Widgets */
.widgets { display: flex; gap: 24px; }
.widget {
  flex: 1; min-width: 0; height: 330px; border-radius: 38px; padding: 30px 34px; text-align: left; color: var(--text);
  background: var(--glass); border: 1px solid var(--stroke);
  backdrop-filter: blur(30px) saturate(1.4); box-shadow: 0 24px 50px -24px var(--shadow);
}
.widget.weather { flex: 1.3; }
button.widget:focus { transform: scale(1.035); background: var(--tile-focus); box-shadow: 0 34px 60px -20px var(--shadow-strong); z-index: 2; }
.w-head { display: flex; justify-content: space-between; align-items: center; font-size: 22px; font-weight: 500; color: var(--text2); }
.pill { font-size: 16px; font-weight: 600; padding: 5px 12px; border-radius: 999px; background: var(--tile); color: var(--text2); border: 1px solid var(--stroke); }

.weather { display: grid; grid-template-columns: 236px 1fr; gap: 0; }
.w-now { padding-right: 26px; border-right: 1px solid var(--stroke); }
.w-temp { display: flex; align-items: center; gap: 10px; margin: 18px 0 8px; }
.w-temp svg { width: 64px; height: 64px; color: var(--text2); }
.w-temp b { font-size: 92px; font-weight: 300; letter-spacing: -.04em; line-height: 1; }
.w-desc { font-size: 25px; font-weight: 500; }
.w-mm { font-size: 19px; color: var(--text2); margin-top: 6px; }
.w-hours { padding-left: 26px; display: flex; flex-direction: column; justify-content: space-between; }
.hours { display: grid; grid-template-columns: repeat(6, 1fr); text-align: center; margin-top: 30px; }
.hours span { display: block; font-size: 19px; color: var(--text2); }
.hours svg { width: 36px; height: 36px; margin: 12px 0 8px; color: var(--text2); }
.hours b { font-size: 23px; font-weight: 500; }
.sun-times { display: flex; justify-content: center; gap: 30px; font-size: 18px; color: var(--text2); }
.sun-times span { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.sun-times svg { width: 22px; height: 22px; }

.ambi-mid { display: flex; align-items: center; gap: 26px; margin: 20px 0 18px; }
.mini-tv {
  width: 116px; height: 68px; flex: none; border-radius: 9px; background: #15161a; border: 3px solid #26272c;
  box-shadow: -16px 0 26px -2px var(--gl), 16px 0 26px -2px var(--gr), 0 -12px 24px -2px var(--gt), 0 12px 24px -2px var(--gb);
  transition: box-shadow 1s;
}
.bright { flex: 1; display: flex; align-items: center; gap: 12px; }
.bbtn { width: 48px; height: 48px; flex: none; border-radius: 50%; border: 1px solid var(--stroke); background: var(--tile); color: var(--text); font-size: 26px; line-height: 1; }
.bbtn:focus { transform: scale(1.18); background: var(--tile-focus); box-shadow: 0 14px 26px -10px var(--shadow-strong); }
.bar { flex: 1; display: flex; gap: 6px; }
.bar i { flex: 1; height: 10px; border-radius: 5px; background: var(--text3); opacity: .35; }
.bar i.on { background: var(--text); opacity: 1; }
.modes { display: flex; flex-wrap: wrap; gap: 10px; }
.mode { font-size: 18px; font-weight: 500; padding: 10px 17px; border-radius: 999px; border: 1px solid var(--stroke); background: var(--tile); color: var(--text); }
.mode.on { background: var(--accent); color: #fff; border-color: transparent; }
.mode:focus { transform: scale(1.12); box-shadow: 0 14px 26px -10px var(--shadow-strong); }
.mode:not(.on):focus { background: var(--tile-focus); }

#newsList { margin-top: 18px; display: flex; flex-direction: column; gap: 18px; transition: opacity .4s; }
#newsList.out { opacity: 0; }
.n .src { font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.n .src em { font-style: normal; font-weight: 500; color: var(--text2); text-transform: none; letter-spacing: 0; }
.n p { margin: 6px 0 0; font-size: 22px; font-weight: 500; line-height: 1.28; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* Painéis */
#overlay {
  position: absolute; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center;
  background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity .3s;
}
#overlay.open { opacity: 1; pointer-events: auto; }
.panel {
  width: 920px; max-height: 900px; padding: 48px; border-radius: 48px; color: var(--text);
  background: var(--panel); backdrop-filter: blur(40px) saturate(1.6); border: 1px solid var(--stroke);
  box-shadow: 0 50px 100px -30px rgba(0,0,0,.5); transform: scale(.96); transition: transform .35s var(--ease);
}
#overlay.open .panel { transform: none; }
.panel h2 { margin: 0; font-size: 46px; font-weight: 700; letter-spacing: -.02em; }
.panel p.sub { margin: 8px 0 26px; font-size: 22px; color: var(--text2); }
.sec { font-size: 19px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: .06em; margin: 26px 0 10px 24px; }
.sec:first-child { margin-top: 4px; }
.note { font-size: 19px; color: var(--text2); margin: 0 24px 14px; line-height: 1.4; }
.row {
  width: 100%; min-height: 92px; border: 0; border-radius: 24px; background: transparent; color: var(--text);
  display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 18px; padding: 10px 24px; text-align: left;
}
.row + .row, .rw + .row, .row + .rw, .rw + .rw { margin-top: 4px; }
.row:focus { background: var(--tile-focus); transform: scale(1.02); box-shadow: 0 18px 34px -16px var(--shadow-strong); }
.row .ico { width: 56px; height: 56px; border-radius: 16px; background: var(--tile); display: grid; place-items: center; }
.row .ico svg { width: 28px; height: 28px; }
.row .ico.bare { width: auto; height: auto; background: none; border-radius: 0; }
.row b { display: block; font-size: 25px; font-weight: 600; }
.row small { display: block; font-size: 18px; color: var(--text2); margin-top: 3px; }
.row.hidden-item b { color: var(--text3); }
.row.hidden-item .ico { opacity: .45; }
.row.danger b { color: #ff453a; }
.row.lifted { background: var(--tile-focus); box-shadow: 0 0 0 3px var(--accent), 0 24px 44px -16px var(--shadow-strong); transform: scale(1.04); }
.end-t { font-size: 20px; color: var(--text2); }
.end-t.pos { color: var(--pos); font-weight: 600; }
.val { font-size: 21px; font-weight: 600; color: var(--accent); white-space: nowrap; }
.grip { display: flex; align-items: center; gap: 8px; font-size: 18px; color: var(--text3); white-space: nowrap; }
.grip svg { width: 24px; height: 24px; }
.row.lifted .grip { color: var(--accent); font-weight: 600; }
.radio { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--text3); display: grid; place-items: center; }
.radio.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.radio svg { width: 20px; height: 20px; }
.switch { display: block; width: 64px; height: 38px; border-radius: 999px; background: var(--text3); position: relative; transition: background .25s; }
.switch i { position: absolute; left: 4px; top: 4px; width: 30px; height: 30px; border-radius: 50%; background: #fff; transition: transform .25s var(--ease); box-shadow: 0 2px 6px rgba(0,0,0,.3); }
.switch.on { background: var(--accent); }
.switch.on i { transform: translateX(26px); }
.rw { display: flex; gap: 10px; align-items: center; }
.rw .row { flex: 1; }
.sw { height: 92px; width: 104px; flex: none; border: 0; border-radius: 24px; background: transparent; display: grid; place-items: center; }

.cat { display: flex; align-items: center; gap: 16px; height: 70px; padding: 0 18px; border: 0; border-radius: 20px; background: transparent; color: var(--text2); font-size: 24px; font-weight: 500; text-align: left; }

/* ---------- Navegação por controle remoto ---------- */
function focusEl(el) { if (el) el.focus({ preventScroll: true }); }
function refocus(act) { focusEl(document.querySelector(`[data-act="${CSS.escape(act)}"]`)); }
const firstHome = () => $('#blocks .f') || $('#header .f');
function candidates() {
  return [...(state.panel ? $('#overlay') : $('#content')).querySelectorAll('.f')];
}
function move(dir) {
  const list = candidates(), cur = document.activeElement;
  if (!list.includes(cur)) { focusEl(state.panel ? list[0] : firstHome()); return; }
  const a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bs = Infinity;
  for (const e of list) {
    if (e === cur) continue;
    const b = e.getBoundingClientRect(), bx = b.left + b.width / 2, by = b.top + b.height / 2;
    let score;
    if (dir === 'left' || dir === 'right') {
      const d = dir === 'right' ? bx - ax : ax - bx;
      if (d <= 4) continue;
      const gap = Math.max(0, dir === 'right' ? b.left - a.right : a.left - b.right);
      const off = Math.max(0, Math.max(a.top, b.top) - Math.min(a.bottom, b.bottom));
      score = gap + off * 4 + Math.abs(by - ay) * 0.2;
    } else {
      const d = dir === 'down' ? by - ay : ay - by;
      if (d <= 4) continue;
      const gap = Math.max(0, dir === 'down' ? b.top - a.bottom : a.top - b.bottom);
      const off = Math.max(0, Math.max(a.left, b.left) - Math.min(a.right, b.right));
      score = gap + off * 2 + Math.abs(bx - ax) * 0.35;
    }
    if (score < bs) { bs = score; best = e; }
  }
  focusEl(best);
}
function back() {
  if (state.moving) dropMove();
  else if (state.panel) closePanel();
  else if (scrollY > 0) focusEl(firstHome());
}

    : r.move ? `<span class="grip">${lifted ? 'Soltar' : 'Mover'} ${ICON.grip}</span>`
    : r.end ? `<span class="end-t ${r.on ? 'pos' : ''}">${r.end}</span>` : '<span></span>';
  const sub = lifted ? '↑ ↓ para mover · Enter para soltar' : r.sub;
  const cls = [lifted && 'lifted', r.danger && 'danger', r.sw && !r.swOn && 'hidden-item'].filter(Boolean).join(' ');
  const ico = r.thumb ? `<span class="ico bare">${r.thumb}</span>` : `<span class="ico">${ICON[r.icon] || ''}</span>`;
  const main = `<button class="row f ${cls}" data-act="${r.act}">${ico}<span><b>${r.label}</b>${sub ? `<small>${sub}</small>` : ''}</span>${end}</button>`;
  if (!r.sw) return main;
  return `<div class="rw">${main}<button class="sw f" data-act="${r.sw}" title="Mostrar ou ocultar"><span class="switch ${r.swOn ? 'on' : ''}"><i></i></span></button></div>`;
}
function renderPanel() {
  if (state.panel === 'custom') return renderSettings();
  if (state.panel === 'apps') {
    $('#overlay').innerHTML = `<div class="panel"><h2>Todos os apps</h2><p class="sub">Para escolher os apps da barra, use Personalizar → Apps</p><div class="grid">${
      ALL_APPS.map(a => `<button class="gapp f" data-act="app:${a.id}"><span class="mt big">${tileHtml(a)}</span>${a.name}</button>`).join('')}</div></div>`;
    return;
  }
  const p = PANELS[state.panel]();
  $('#overlay').innerHTML = `<div class="panel"><h2>${p.title}</h2><p class="sub">${p.sub}</p>${p.rows.map(rowHtml).join('')}</div>`;
}
function openPanel(name) {
  const cur = document.activeElement;
  state.returnAct = cur && cur.dataset ? cur.dataset.act : null;
  state.panel = name;
  renderPanel();
  $('#overlay').classList.add('open');
  focusEl($('#overlay .f'));
}
function closePanel() {
  state.panel = null; state.moving = null; state.confirmReset = false;
  $('#overlay').classList.remove('open');
  const back = state.returnAct && document.querySelector(`#content [data-act="${CSS.escape(state.returnAct)}"]`);
  focusEl(back || firstHome());
}

/* ---------- Painel Personalizar ---------- */
const CATS = [
  ['aparencia', 'Aparência', 'palette'], ['inicio', 'Tela inicial', 'layout'], ['cabecalho', 'Cabeçalho', 'header'],
  ['relogio', 'Relógio flutuante', 'clock'], ['apps', 'Apps', 'grid'], ['entradas', 'Entradas e atalhos', 'hdmi'], ['widgets', 'Widgets', 'widgets'], ['sistema', 'Sistema', 'sliders']
];
const cyc = (key, icon, label, sub) => ({ act: 'cycle:' + key, icon, label, sub, value: labelOf(key, cfg[key]) });
const tog = (key, icon, label, sub) => ({ act: 'tog:' + key, icon, label, sub, toggle: true, on: key === 'frame' ? state.frame : cfg[key] });
const moveRow = (list, id, label, sub, look, on) => ({ act: `move:${list}:${id}`, move: true, label, sub, ...look, sw: `vis:${list}:${id}`, swOn: on });
const SETTINGS = {
  aparencia: () => ({

      { heading: 'Tema' },

      { act: 'theme:dark', icon: 'moon', label: 'Escuro', sub: 'Sempre escuro', check: true, on: state.theme === 'dark' },
      { act: 'theme:auto', icon: 'auto', label: 'Automático', sub: `Escurece no pôr do sol (${SUNSET}) e clareia às ${SUNRISE}`, check: true, on: state.theme === 'auto' },
      { heading: 'Estilo' },
      cyc('accent', 'palette', 'Cor de destaque', 'Indicadores, botões ativos e chaves'),
      cyc('bg', 'layout', 'Fundo', 'Fundo atrás dos blocos'),
      cyc('motion', 'star', 'Animações', 'Reduzidas deixam a navegação mais seca e rápida'),
      { heading: 'Pré-visualização' },
      tog('frame', 'ambi', 'Moldura da TV e Ambilight', 'Só existe no protótipo do computador')
    ]
  }),
  inicio: () => ({
    title: 'Tela inicial', sub: 'Ordem e visibilidade dos blocos',
    rows: [
      { note: 'Selecione um bloco e use ↑ ↓ para mudar a ordem. A chave ao lado mostra ou esconde o bloco.' },
      ...cfg.blocks.map(b => moveRow('blocks', b.id, BLOCKS[b.id].label, BLOCKS[b.id].sub, { icon: BLOCKS[b.id].icon }, b.on))
    ]
  }),
  cabecalho: () => ({
    title: 'Cabeçalho', sub: 'Título, abas, relógio e clima no topo',
    rows: [
      { heading: 'Título e abas' },
      cyc('title', 'header', 'Título', 'Texto grande no topo da tela'),
      tog('showTabs', 'layout', 'Mostrar abas', 'Explorar, Filmes e Séries'),
      cyc('startTab', 'star', 'Aba inicial', 'Conteúdo exibido ao ligar a TV'),
      { heading: 'Relógio e status' },
      cyc('clock', 'info', 'Formato da hora', 'Relógio no canto superior direito'),
      tog('showDate', 'info', 'Mostrar data', 'Dia da semana e data ao lado da hora'),
      tog('showWeatherTop', 'sun', 'Mostrar clima no topo', 'Temperatura atual ao lado da data')
    ]
  }),
  relogio: () => ({
    title: 'Relógio flutuante', sub: 'Hora e clima por cima de qualquer app, com um botão do controle',
    rows: [
      { note: 'No protótipo, aperte H em qualquer tela, inclusive com um app aberto. Na TV, ele funcionará por cima de YouTube, Netflix e qualquer outro app.' },
      { act: 'osd:test', icon: 'clock', label: 'Testar agora', sub: 'Mostra o relógio flutuante por alguns segundos' },
      { heading: 'Conteúdo' },
      tog('osdDate', 'info', 'Mostrar data', 'Dia da semana e data abaixo da hora'),
      tog('osdTemp', 'sun', 'Mostrar temperatura', `Da cidade configurada em Widgets (${cfg.city})`),
      tog('osdCity', 'globe', 'Mostrar cidade', 'Nome da cidade abaixo da temperatura'),
      { heading: 'Exibição' },
      cyc('osdPos', 'layout', 'Posição', 'Onde a barra aparece na tela'),
      cyc('osdDur', 'clock', 'Tempo na tela', 'Some sozinha depois desse tempo'),
      { heading: 'Botão do controle' },
      { act: 'osd:key', icon: 'remote', label: 'Definir botão', sub: 'Na TV, este item espera você apertar o botão desejado', value: 'H (protótipo)' }
    ]
  }),
  apps: () => ({
    title: 'Apps', sub: `Ordem e apps da barra · ${cfg.apps.filter(a => a.on).length} na barra`,
    rows: [
      { note: `Selecione um app e use ↑ ↓ para mudar a posição. A chave coloca ou tira o app da barra. Cabem ${DOCK_VISIBLE} na tela; com mais, a barra rola para os lados.` },
      ...cfg.apps.map(a => { const app = appById(a.id); return moveRow('apps', a.id, app.name, a.on ? 'Na barra' : 'Fora da barra', { thumb: `<span class="mt">${tileHtml(app)}</span>` }, a.on); })
    ]
  }),
  entradas: () => ({
    title: 'Entradas e atalhos', sub: 'Nomes das entradas HDMI e atalhos rápidos',

      { heading: 'Entradas' },

      ...INPUT_IDS.map(id => {
        const info = inputInfo(id), on = cfg.inputs[id].on;
        if (id === 'live') return { act: 'noop', icon: 'tv', label: 'TV ao Vivo', sub: 'Sintonizador da TV', sw: 'ivis:live', swOn: on };
        return { act: 'cycle:iname:' + id, icon: info.icon, label: 'HDMI ' + id.slice(4), sub: (NO_SIGNAL.includes(id) ? 'Sem sinal agora · ' : '') + 'Enter troca o nome', value: cfg.inputs[id].name || 'Sem nome', sw: 'ivis:' + id, swOn: on };
      }),
      { heading: 'Atalhos' },
      tog('showShortcuts', 'grid', 'Mostrar atalhos', 'Grupo "Atalhos" na tela inicial'),
      ...cfg.shortcuts.map(s => moveRow('shortcuts', s.id, SHORTCUTS[s.id].label, null, { icon: SHORTCUTS[s.id].icon }, s.on))
    ]
  }),

    title: 'Widgets', sub: 'Ordem, visibilidade e opções de cada widget',
    rows: [
      { heading: 'Ordem e visibilidade' },
      ...cfg.widgets.map(w => moveRow('widgets', w.id, WIDGETS[w.id].label, WIDGETS[w.id].sub, { icon: WIDGETS[w.id].icon }, w.on)),
      { heading: 'Clima' },
      cyc('city', 'globe', 'Cidade', 'Previsão simulada no protótipo'),
      cyc('unit', 'sun', 'Unidade', 'Temperatura em todos os lugares'),
      { heading: 'Notícias' },
      cyc('newsCat', 'news', 'Categoria', 'Quais manchetes aparecem'),
      cyc('newsSpeed', 'info', 'Trocar a cada', 'Tempo até mostrar as próximas manchetes'),
      { heading: 'Ambilight' },
      { note: 'O modo e o brilho do Ambilight ficam no próprio widget, para mudar rápido com o controle.' }
    ]
  }),
  sistema: () => ({
    title: 'Sistema', sub: 'Ajustes da TV e do launcher',
    rows: [
      { act: 'sc:sys', icon: 'sliders', label: 'Ajustes da TV', sub: 'Imagem, som e rede no menu original da Philips' },
      { act: 'reset', icon: 'reset', label: state.confirmReset ? 'Pressione de novo para confirmar' : 'Restaurar padrões', sub: 'Volta a ordem, a visibilidade e as opções ao original', danger: true },
      { heading: 'Sobre' },
      { note: 'TV Launcher · protótipo v0.2 · conteúdo, clima, notícias e dispositivos simulados.' }

  })
};
function renderSettings() {
  $('#overlay').innerHTML = `<div class="panel wide">
    <nav class="side"><h2>Personalizar</h2><p class="sub">Tela inicial do launcher</p>
      ${CATS.map(([id, l, i]) => `<button class="cat f ${id === state.cat ? 'active' : ''}" data-act="cat:${id}">${ICON[i]}${l}</button>`).join('')}
    </nav>
    <div class="main" id="smain"></div></div>`;
  renderSettingsMain();
}
function renderSettingsMain(resetScroll) {
  const main = $('#smain'); if (!main) return;
  const prev = main.querySelector('.pscroll');
  const top = prev && !resetScroll ? prev.scrollTop : 0;
  const c = SETTINGS[state.cat]();
  main.innerHTML = `<h2>${c.title}</h2><p class="sub">${c.sub}</p><div class="pscroll">${c.rows.map(rowHtml).join('')}</div>`;
  const sc = main.querySelector('.pscroll');
  sc.style.scrollBehavior = 'auto'; sc.scrollTop = top; sc.style.scrollBehavior = '';
}
function refreshPanel() { if (state.panel === 'custom') renderSettingsMain(); else renderPanel(); }
function panelScroll(el) {
  const sc = el.closest('.pscroll'); if (!sc) return;
  const box = el.closest('.rw') || el;
  const t = box.offsetTop, b = t + box.offsetHeight;
  if (t < sc.scrollTop + 16) sc.scrollTop = t - 60;
  else if (b > sc.scrollTop + sc.clientHeight - 16) sc.scrollTop = b - sc.clientHeight + 40;
}
function afterCfg() { saveCfg(); applyLook(); renderHome(); }
function moveItem(d) {
  const { list, id } = state.moving, arr = cfg[list];
  const i = arr.findIndex(x => x.id === id), j = i + d;
  if (j < 0 || j >= arr.length) return;
  [arr[i], arr[j]] = [arr[j], arr[i]];
  afterCfg(); renderSettingsMain(); refocus(`move:${list}:${id}`);
  panelScroll(document.activeElement);
}
function dropMove() {
  const act = `move:${state.moving.list}:${state.moving.id}`;
  state.moving = null; renderSettingsMain(); refocus(act);
  toast('Ordem salva');
}

/* ---------- App aberto (simulação) ---------- */
function openApp(app, title) {
  if (state.panel) closePanel();
  state.appOpen = app.id;
  $('#appview').innerHTML = `<div class="av-logo">${tileHtml(app)}</div>
    <div class="av-txt">${title ? `<b>${title}</b>` : `<b>${app.name}</b>`}
      Simulação do app aberto · aperte <kbd>H</kbd> para ver o relógio · <kbd>Esc</kbd> volta à tela inicial</div>`;
  $('#appview').classList.add('open');
}
function closeApp() {
  state.appOpen = null;
  $('#appview').classList.remove('open');
}

/* ---------- Relógio flutuante ---------- */
/* Aperto curto: mostra e some após o tempo configurado. Segurando: fica fixo e a contagem
   só começa ao soltar. Repetições automáticas da tecla segurada são ignoradas. */
let osdT, osdClockT, osdHeld = false;
function clockText(n) {
  const h = n.getHours(), m = String(n.getMinutes()).padStart(2, '0');
  return cfg.clock === '12' ? `${h % 12 || 12}:${m} ${h < 12 ? 'AM' : 'PM'}` : `${String(h).padStart(2, '0')}:${m}`;
}
function showOsd(hold) {
  const o = $('#osd'), n = new Date(), h = n.getHours();
  const date = n.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'short' });
  o.innerHTML = `<div class="osd-clock"><span class="osd-time">${clockText(n)}</span>${cfg.osdDate ? `<small>${date}</small>` : ''}</div>`
    + (cfg.osdTemp ? `<span class="osd-sep"></span><div class="osd-w">${W[kindAt(h)]}<span><b>${fmtT(tempAt(h))}</b>${cfg.osdCity ? `<small>${cfg.city}</small>` : ''}</span></div>` : '')
    + '<i class="osd-prog"></i>';
  o.classList.toggle('top', cfg.osdPos === 'superior');
  o.classList.add('show');
  clearInterval(osdClockT);
  osdClockT = setInterval(() => { const t = o.querySelector('.osd-time'); if (t) t.textContent = clockText(new Date()); }, 1000);
  clearTimeout(osdT);
  if (!hold) startOsdCountdown();
}
function startOsdCountdown() {
  const p = $('#osd .osd-prog'); if (!p) return;
  p.style.animation = `osdprog ${cfg.osdDur}s linear forwards`;
  clearTimeout(osdT); osdT = setTimeout(hideOsd, cfg.osdDur * 1000);
}
function hideOsd() { clearTimeout(osdT); clearInterval(osdClockT); osdHeld = false; $('#osd').classList.remove('show'); }
function osdKeyDown(e) {
  if (e.repeat) return;
  if ($('#osd').classList.contains('show') && !osdHeld) { hideOsd(); return; }
  osdHeld = true; showOsd(true);
}
function osdKeyUp() {
  if (!osdHeld) return;
  osdHeld = false; startOsdCountdown();
}

/* ---------- Ações ---------- */
let toastT;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200);
}
function act(a) {
  const [k, v, w] = a.split(':');
  switch (k) {
    case 'open': { const it = CONTENT[state.tab][+v]; openApp(ALL_APPS.find(x => x.name === it.app), it.t); break; }
    case 'tab': focusEl($('#hero .f') || firstHome()); break;
    case 'app': openApp(appById(v)); break;
    case 'osd':
      if (v === 'test') showOsd();
      else toast('Na TV, aqui você aperta o botão do controle que quer usar');
      break;
    case 'input': {
      state.input = v; save('input'); renderInputs(); refocus(a);
      const it = inputInfo(v);
      toast('Entrada: ' + (it.sub ? `${it.label} (${it.sub})` : it.label));
      break;
    }
    case 'sc':
      if (v === 'ambi') { const b = document.querySelector(`[data-act="ambi:mode:${state.ambi.mode}"]`); b ? focusEl(b) : toast('Ative o widget Ambilight em Personalizar → Widgets'); }
      else if (v === 'sys') toast('Abriria o menu de ajustes original da Philips');
      else openPanel(v);
      break;
    case 'hdr':
      if (v === 'bt') openPanel('bt');
      if (v === 'inputs') { const b = document.querySelector(`[data-act="input:${state.input}"]`) || $('#inputs .f'); b ? focusEl(b) : toast('As entradas estão ocultas em Personalizar'); }
      if (v === 'theme') cycleTheme();
      if (v === 'settings') openPanel('custom');
      break;
    case 'ambi':
      if (v === 'mode') state.ambi.mode = w;
      else state.ambi.bright = Math.min(5, Math.max(1, state.ambi.bright + (w === '+' ? 1 : -1)));
      save('ambi'); renderAmbi(); applyGlow(); refocus(a);
      break;
    case 'weather': toast('Abriria a previsão completa'); break;
    case 'news': toast('Abriria a notícia completa'); break;
    case 'bt': {
      if (v === 'scan') { toast('Procurando dispositivos próximos…'); break; }
      const d = state.bt.find(x => x.id === v);
      if (d.busy) break;
      d.busy = true; renderPanel(); refocus(a);
      setTimeout(() => {
        d.busy = false; d.on = !d.on; save('bt');
        if (!d.on && state.audio === d.id) { state.audio = 'tv'; save('audio'); }
        if (state.panel === 'bt') { renderPanel(); refocus(a); }
        toast(`${d.name} ${d.on ? 'conectado' : 'desconectado'}`);
      }, 900);
      break;
    }
    case 'audio': {
      state.audio = v; save('audio');
      const d = state.bt.find(x => x.id === v);
      if (d) { d.on = true; save('bt'); }
      renderPanel(); refocus(a);
      toast('Som saindo por: ' + AUDIO.find(x => x.id === v).label);
      break;
    }
    case 'theme': state.theme = v; save('theme'); applyTheme(); refreshPanel(); refocus(a); break;
    /* Personalizar */
    case 'cat': focusEl($('#smain .f')); break;
    case 'cycle':
      if (v === 'iname') cfg.inputs[w].name = nextOf(NAME_PRESETS, cfg.inputs[w].name);
      else cfg[v] = nextOf(CYCLES[v].map(o => o[0]), cfg[v]);
      if (v === 'startTab') state.tab = cfg.startTab;
      if (v === 'newsCat') newsIdx = 0;
      afterCfg(); if (v === 'newsSpeed') restartNews();
      refreshPanel(); refocus(a);
      break;
    case 'tog':
      if (v === 'frame') toggleFrame(); else { cfg[v] = !cfg[v]; afterCfg(); }
      refreshPanel(); refocus(a);
      break;
    case 'vis': {
      const item = cfg[v].find(x => x.id === w);
      item.on = !item.on; afterCfg(); refreshPanel(); refocus(a);
      break;
    }
    case 'ivis': cfg.inputs[v].on = !cfg.inputs[v].on; afterCfg(); refreshPanel(); refocus(a); break;
    case 'move':
      if (state.moving) { dropMove(); break; }
      state.moving = { list: v, id: w }; renderSettingsMain(); refocus(a);
      break;
    case 'reset':
      if (!state.confirmReset) {
        state.confirmReset = true; refreshPanel(); refocus(a);
        setTimeout(() => { if (state.confirmReset) { state.confirmReset = false; if (state.panel === 'custom' && state.cat === 'sistema') { refreshPanel(); refocus(a); } } }, 4000);
      } else {
        cfg = clone(DEFAULT_CFG); state.theme = 'auto'; save('theme'); state.tab = cfg.startTab; state.confirmReset = false;
        afterCfg(); applyTheme(); restartNews(); refreshPanel(); refocus(a);
        toast('Padrões restaurados');
      }
      break;
  }
}

/* ---------- Eventos ---------- */
document.addEventListener('keydown', e => {
  const dirs = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
  if (state.moving) {
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); moveItem(e.key === 'ArrowUp' ? -1 : 1); return; }
    if (['Enter', ' ', 'Escape', 'Backspace'].includes(e.key)) { e.preventDefault(); dropMove(); return; }
    if (dirs[e.key]) { e.preventDefault(); return; }
  }
  if (e.key === 'h' || e.key === 'H') { osdKeyDown(e); return; }
  if (state.appOpen) {
    if (e.key === 'Escape' || e.key === 'Backspace') closeApp();
    if (e.key !== 't' && e.key !== 'T' && e.key !== 'f' && e.key !== 'F') { e.preventDefault(); return; }
  }
  if (dirs[e.key]) { e.preventDefault(); move(dirs[e.key]); }
  else if (e.key === 'Escape' || e.key === 'Backspace') { e.preventDefault(); back(); }
  else if (e.key === 't' || e.key === 'T') cycleTheme();
  else if (e.key === 'f' || e.key === 'F') { toggleFrame(); if (state.panel === 'custom' && state.cat === 'aparencia') { refreshPanel(); refocus('tog:frame'); } }
});
document.addEventListener('keyup', e => { if (e.key === 'h' || e.key === 'H') osdKeyUp(); });
addEventListener('blur', osdKeyUp);
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (el) act(el.dataset.act);
  else if (state.panel && e.target.id === 'overlay') closePanel();
});
document.addEventListener('focusin', e => {
  const el = e.target;
  if (state.panel) {
    if (el.classList.contains('cat')) {
      const c = el.dataset.act.split(':')[1];
      if (c !== state.cat) {
        state.cat = c; state.confirmReset = false;
        document.querySelectorAll('.cat').forEach(x => x.classList.toggle('active', x === el));
        renderSettingsMain(true);
      }
    } else panelScroll(el);
    return;
  }
  ensureVisible(el);
  if (el.closest('.dock-vp')) ensureDockTile(el);
  if (el.classList.contains('tab')) {
    const t = el.dataset.act.split(':')[1];
    if (t !== state.tab) {
      state.tab = t;
      document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x === el));
      renderHero();
      videoColors = CONTENT[t][0].c; applyGlow();
    }
  }
  if (el.classList.contains('art')) { videoColors = CONTENT[state.tab][+el.dataset.i].c; applyGlow(); }
});
document.addEventListener('mousemove', e => {
  const el = e.target.closest('.f');
  if (!el || el === document.activeElement || state.moving) return;
  if (state.panel && !$('#overlay').contains(el)) return;
  const sec = el.closest('#header, .block');
  if (!state.panel && sec && sec.classList.contains('off')) return;
  focusEl(el);
});
let wheelT = 0;
$('#stage').addEventListener('wheel', e => {
  if (state.panel || Date.now() - wheelT < 600) return;
  wheelT = Date.now();
  if (e.deltaY > 0) {
    const next = sections().find(s => s.offsetTop > scrollY + 200 && s.classList.contains('off'));
    if (next) focusEl(next.querySelector('.f'));
  } else if (scrollY > 0) focusEl(firstHome());
}, { passive: true });
for (const sel of ['.screen', '#stage']) $(sel).addEventListener('scroll', e => { e.target.scrollTop = 0; e.target.scrollLeft = 0; });
addEventListener('resize', layout);

function tick() {
  const n = new Date();
  $('#clock').textContent = clockText(n);
  $('#date').textContent = n.toLocaleDateString('pt-BR', { weekday: 'long', day: 'numeric', month: 'long' });
  if (cfg.title === 'saudacao') $('#title').textContent = greeting();
  if (state.theme === 'auto') applyTheme();
}
setInterval(tick, 15000);
setInterval(renderWeather, 10 * 60000);

applyLook(); applyTheme(); renderHome(); applyGlow(); layout(); restartNews();
focusEl(firstHome());
</script>
