<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Launcher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Bebas+Neue&family=Pacifico&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root { --ease: cubic-bezier(.2,.8,.2,1); --gl: transparent; --gt: transparent; --gr: transparent; --gb: transparent; --accent: #0a84ff; }
:root[data-theme="light"] {
  --bg1:#f4f6fa; --bg2:#dce2eb; --blob1:#c6d6f2; --blob2:#f3dac6; --blob3:#d4eaee;
  --text:#1d1d1f; --text2:#6e6e73; --text3:#a1a1a6;
  --glass:rgba(255,255,255,.5); --stroke:rgba(255,255,255,.8);
  --tile:rgba(255,255,255,.6); --tile-focus:#fff;
  --shadow:rgba(40,52,80,.16); --shadow-strong:rgba(30,40,70,.34);
  --panel:rgba(246,247,250,.92); --scrim:rgba(20,24,32,.3);
  --pos:#1f9d55; --invert:#fff;
}
:root[data-theme="dark"] {
  --bg1:#0d0e13; --bg2:#171922; --blob1:#1b2745; --blob2:#33202d; --blob3:#0f2a2b;
  --text:#f5f5f7; --text2:#98989f; --text3:#5c5c63;
  --glass:rgba(255,255,255,.06); --stroke:rgba(255,255,255,.08);
  --tile:rgba(255,255,255,.08); --tile-focus:rgba(255,255,255,.24);
  --shadow:rgba(0,0,0,.45); --shadow-strong:rgba(0,0,0,.75);
  --panel:rgba(30,31,38,.94); --scrim:rgba(0,0,0,.5);
  --pos:#30d158; --invert:#111;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  font-family: Inter, -apple-system, "SF Pro Display", "Segoe UI", sans-serif;
  background: radial-gradient(ellipse at 50% 115%, #3b2b1d 0%, #16120e 60%, #0c0a08 100%);
  -webkit-font-smoothing: antialiased;
}
body.noframe { background: #000; }
button { font-family: inherit; cursor: pointer; }

/* ---------- Ambilight (pré-visualização na parede) ---------- */
#glow { position: fixed; pointer-events: none; transition: opacity .8s; }
#glow i { position: absolute; border-radius: 50%; filter: blur(70px); transition: background 1.2s; }
#glow .gl { left: -9%; top: 4%; width: 22%; height: 92%; background: var(--gl); }
#glow .gr { right: -9%; top: 4%; width: 22%; height: 92%; background: var(--gr); }
#glow .gt { left: 4%; top: -16%; width: 92%; height: 32%; background: var(--gt); }
#glow .gb { left: 4%; bottom: -12%; width: 92%; height: 24%; background: var(--gb); }
#glow[data-mode="lounge"] { animation: hue 16s linear infinite; }
#glow[data-mode="audio"] i { animation: pulse .9s ease-in-out infinite alternate; }
#glow[data-mode="audio"] .gr { animation-delay: .3s; }
#glow[data-mode="audio"] .gt { animation-delay: .5s; }
@keyframes hue { to { filter: hue-rotate(360deg); } }
@keyframes pulse { from { opacity: .45; transform: scale(.92); } to { opacity: 1; transform: scale(1.05); } }
body.noframe #glow, body.noframe #hint { display: none; }

#hint {
  position: fixed; left: 0; right: 0; bottom: 14px; text-align: center;
  color: rgba(255,255,255,.45); font-size: 13px; letter-spacing: .01em;
}
#hint kbd {
  font-family: inherit; font-size: 12px; padding: 2px 7px; border-radius: 6px;
  background: rgba(255,255,255,.1); color: rgba(255,255,255,.75); margin: 0 3px;
}

/* ---------- Tela (1920×1080, escalada) ---------- */
#stage {
  visibility: hidden;   /* só aparece depois de layout() calcular a escala (evita a tela gigante ao abrir) */
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
  transform-origin: 0 0; overflow: hidden; border-radius: 8px;
  box-shadow: 0 0 0 12px #050505, 0 40px 90px rgba(0,0,0,.7);
  color: var(--text);
}
body.noframe #stage { box-shadow: none; border-radius: 0; }
.screen { position: absolute; inset: 0; overflow: hidden; background: linear-gradient(160deg, var(--bg1), var(--bg2)); transition: background .6s; }
.blobs i { position: absolute; border-radius: 50%; filter: blur(150px); transition: background .6s, opacity .6s; }
.blobs .b1 { width: 900px; height: 700px; left: -200px; top: -250px; background: var(--blob1); }
.blobs .b2 { width: 800px; height: 700px; right: -200px; top: 200px; background: var(--blob2); }
.blobs .b3 { width: 900px; height: 600px; left: 500px; bottom: -350px; background: var(--blob3); }
.screen[data-bg="liso"] .blobs { display: none; }
.screen[data-bg="vivo"] .blobs i { filter: blur(110px); }
.screen[data-bg="vivo"] .blobs .b3 { background: color-mix(in srgb, var(--accent) 55%, transparent); }
.screen[data-bg="vivo"] .blobs .b1 { background: color-mix(in srgb, var(--accent) 30%, var(--blob1)); }

#content { position: relative; padding: 76px 120px 0; transition: transform .6s var(--ease); }
#header, .block { transition: opacity .45s; }
.off { opacity: 0; }
.block + .block { margin-top: 40px; }
#header + #blocks > .block:first-child { margin-top: 0; }

.f { outline: none; transition: transform .28s var(--ease), box-shadow .28s var(--ease), background .2s, color .2s, opacity .2s; }
html[data-motion="reduzidas"] .f, html[data-motion="reduzidas"] #content { transition-duration: .08s; }

/* Cabeçalho */
#header { display: flex; justify-content: space-between; align-items: flex-start; min-height: 176px; }
h1 { font-size: 78px; font-weight: 700; letter-spacing: -.025em; margin: 0; line-height: 1; }
.tabs { display: flex; gap: 6px; margin: 22px 0 0 -18px; }
.tab { font-size: 28px; font-weight: 500; color: var(--text2); padding: 10px 20px; border-radius: 999px; background: transparent; border: 0; }
.tab.active { color: var(--text); font-weight: 600; }
.tab:focus { background: var(--tile-focus); color: var(--text); transform: scale(1.08); box-shadow: 0 14px 30px -10px var(--shadow-strong); }
.right { display: flex; flex-direction: column; align-items: flex-end; gap: 18px; }
.icons { display: flex; gap: 16px; }
.ibtn {
  width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center;
  background: var(--glass); border: 1px solid var(--stroke); color: var(--text);
  backdrop-filter: blur(20px); box-shadow: 0 8px 20px -10px var(--shadow);
}
.ibtn svg { width: 30px; height: 30px; }
.ibtn:focus { transform: scale(1.18); background: var(--tile-focus); box-shadow: 0 18px 34px -10px var(--shadow-strong); }
.status { display: flex; align-items: center; gap: 18px; color: var(--text2); font-size: 23px; font-weight: 500; }
.status .clock { font-size: 30px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
.wmini { display: flex; align-items: center; gap: 6px; }
.wmini svg { width: 30px; height: 30px; color: var(--text2); }
#date::first-letter { text-transform: uppercase; }

/* Destaques */
.hero { height: 558px; overflow: hidden; padding: 24px 40px 0; margin: -24px -40px 0; }
.hero-track { display: flex; gap: 40px; transition: transform .45s var(--ease); }
html.tv .hero-track { transition-duration: .25s; }
.hero .card { flex: none; }
.more-card { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: var(--tile); color: var(--text); border: 1px solid var(--stroke); }
.more-card::after { display: none; }
.more-card svg { width: 64px; height: 64px; color: var(--text2); }
.more-card b { font-size: 30px; font-weight: 600; }
.more-card small { font-size: 20px; color: var(--text2); }
.more-card:focus { background: var(--tile-focus); }
.card { display: flex; flex-direction: column; gap: 18px; }
.card.feature { width: 1000px; }
.card.poster { width: 300px; }
.art {
  position: relative; height: 440px; width: 100%; padding: 0; border: 0; border-radius: 28px; overflow: hidden;
  box-shadow: 0 18px 40px -18px var(--shadow);
}
.art::after { content: ""; position: absolute; inset: 0; z-index: 2; background: linear-gradient(180deg, transparent 40%, rgba(0,0,0,.5)); }
.art:focus { transform: scale(1.06) translateY(-8px); box-shadow: 0 44px 70px -22px var(--shadow-strong); z-index: 3; }
.feature .art:focus { transform: scale(1.03) translateY(-8px); }
.art:focus::before { content: ""; position: absolute; inset: 0; z-index: 4; background: linear-gradient(115deg, rgba(255,255,255,.3), transparent 38%); }
.sil { position: absolute; left: 0; bottom: 0; width: 100%; z-index: 1; }
.sil.s1 { height: 58%; fill: rgba(0,0,0,.22); }
.sil.s2 { height: 40%; fill: rgba(0,0,0,.38); }
.art-title {
  position: absolute; left: 40px; right: 40px; bottom: 36px; z-index: 3; text-align: left;
  font: 700 66px/1 "Playfair Display", Georgia, serif; color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,.4);
}
.poster .art-title { font-size: 40px; left: 26px; right: 26px; bottom: 28px; }
.art-badge {
  position: absolute; top: 28px; left: 32px; z-index: 3; font-size: 20px; font-weight: 600; color: #fff;
  padding: 8px 16px; border-radius: 999px; background: rgba(255,255,255,.18); backdrop-filter: blur(12px);
}
.cap b { font-size: 28px; font-weight: 600; letter-spacing: -.01em; }
.cap small { display: block; font-size: 22px; color: var(--text2); margin-top: 6px; }

/* Barra de apps */
.dock {
  padding: 12px 0; border-radius: 46px;
  background: var(--glass); border: 1px solid var(--stroke);
  backdrop-filter: blur(30px) saturate(1.5); box-shadow: 0 24px 50px -24px var(--shadow);
}
.dock-vp { overflow: hidden; padding: 16px 30px; --fl: 0px; --fr: 0px; }
.dock-vp.more-l { --fl: 110px; }
.dock-vp.more-r { --fr: 110px; }
.dock-vp.more-l, .dock-vp.more-r {
  -webkit-mask-image: linear-gradient(90deg, transparent, #000 var(--fl), #000 calc(100% - var(--fr)), transparent);
  mask-image: linear-gradient(90deg, transparent, #000 var(--fl), #000 calc(100% - var(--fr)), transparent);
}
.dock-track { position: relative; display: flex; gap: 24px; transition: transform .45s var(--ease); }
html[data-motion="reduzidas"] .dock-track { transition-duration: .1s; }
.tile {
  width: 181px; height: 110px; flex: none; border: 0; border-radius: 24px; position: relative; overflow: hidden;
  display: flex; align-items: center; justify-content: center; gap: 8px;
  box-shadow: 0 10px 24px -12px rgba(0,0,0,.4);
}
.tile:focus { transform: scale(1.13) translateY(-6px); box-shadow: 0 30px 50px -14px var(--shadow-strong); z-index: 2; }
.tile:focus::after { content: ""; position: absolute; inset: 0; background: linear-gradient(115deg, rgba(255,255,255,.35), transparent 42%); }
.a-tv { background: linear-gradient(160deg, #474c59, #1c1f26); color: #fff; font-size: 23px; font-weight: 700; letter-spacing: -.01em; }
.a-tv svg, .a-br svg { width: 30px; height: 30px; }
.a-yt { background: #fff; color: #0f0f0f; gap: 6px; }
.yt-play { width: 40px; height: 28px; background: #ff0033; border-radius: 8px; position: relative; }
.yt-play::after { content: ""; position: absolute; left: 16px; top: 7px; border-left: 11px solid #fff; border-top: 7px solid transparent; border-bottom: 7px solid transparent; }
.yt-t { font-size: 27px; font-weight: 700; letter-spacing: -.05em; }
.a-prime { background: linear-gradient(160deg, #1fa6ff, #0b6fc0); color: #fff; }
.pv { display: flex; flex-direction: column; align-items: center; }
.pv span { font-size: 25px; font-weight: 700; letter-spacing: -.03em; line-height: 1; }
.pv svg { width: 92px; height: 14px; fill: none; stroke: #fff; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.a-nf { background: #000; color: #e50914; font: 400 54px "Bebas Neue", Impact, sans-serif; letter-spacing: .02em; padding-top: 4px; }
.a-hbo { background: linear-gradient(150deg, #1d1ab8, #5a2ad4 60%, #7d3cf2); color: #fff; }
.hbo { display: flex; flex-direction: column; align-items: center; line-height: .82; }
.hbo b { font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
.hbo i { font-size: 31px; font-weight: 700; font-style: normal; letter-spacing: -.04em; }
.a-cr { background: #f47521; color: #fff; font-size: 23px; font-weight: 700; letter-spacing: -.03em; gap: 7px; }
.cr-logo { width: 30px; height: 30px; border-radius: 50%; flex: none; background: radial-gradient(circle at 64% 38%, #f47521 0 30%, transparent 31%), #fff; }
.a-atv { background: #0b0b0c; color: #fff; font-size: 42px; font-weight: 600; letter-spacing: -.04em; gap: 2px; }
.a-atv svg { width: 36px; height: 36px; fill: #fff; margin-bottom: 7px; }
.a-dis { background: linear-gradient(160deg, #0a1a5c, #1c3e9e); color: #fff; font: 400 34px Pacifico, cursive; }
.a-dis sup { font-family: Inter, sans-serif; font-weight: 500; font-size: 26px; margin-left: 2px; }
.a-glb { background: linear-gradient(135deg, #ff6a3d, #ef1d3a); color: #fff; font-size: 27px; font-weight: 700; letter-spacing: -.04em; }
.a-sp { background: #121212; color: #fff; font-size: 25px; font-weight: 700; letter-spacing: -.03em; }
.sp-dot { width: 30px; height: 30px; border-radius: 50%; background: #1ed760; flex: none; }
.a-tw { background: #9146ff; color: #fff; font-size: 32px; font-weight: 800; letter-spacing: -.03em; }
.a-px { background: #1f1f1f; color: #fff; font-size: 38px; font-weight: 700; letter-spacing: -.03em; }
.a-px b { color: #e5a00d; }
.a-ko { background: linear-gradient(160deg, #17b2e7, #0f6fa8); color: #fff; font-size: 32px; font-weight: 800; letter-spacing: .08em; }
.a-br { background: linear-gradient(160deg, #4a5466, #2a303b); color: #fff; font-size: 22px; font-weight: 600; }
.a-ps { background: #fff; color: #01875f; font-size: 24px; font-weight: 700; letter-spacing: -.02em; }

/* Entradas e atalhos */
.row2 { display: flex; gap: 48px; }
.group h3 { margin: 0 0 16px 6px; font-size: 24px; font-weight: 500; color: var(--text2); }
.chips { display: flex; gap: 16px; }
.chip {
  width: 150px; height: 114px; border-radius: 24px; position: relative;
  border: 1px solid var(--stroke); background: var(--tile); color: var(--text); backdrop-filter: blur(20px);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 9px;
  font-size: 21px; font-weight: 500; box-shadow: 0 10px 24px -16px var(--shadow);
}
.chip span { max-width: 132px; text-align: center; line-height: 1.15; }
.chip svg { width: 32px; height: 32px; }
.chip small { font-size: 15px; color: var(--text2); margin-top: -7px; }
.chip.dim { opacity: .42; }
.chip.active::before { content: ""; position: absolute; top: 13px; right: 14px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 12px var(--accent); }
.chip:focus { transform: scale(1.12) translateY(-4px); background: var(--tile-focus); opacity: 1; box-shadow: 0 26px 44px -14px var(--shadow-strong); z-index: 2; }

/* Widgets */
.widgets { display: flex; gap: 24px; }
.widget {
  flex: 1; min-width: 0; height: 330px; border-radius: 38px; padding: 30px 34px; text-align: left; color: var(--text);
  background: var(--glass); border: 1px solid var(--stroke);
  backdrop-filter: blur(30px) saturate(1.4); box-shadow: 0 24px 50px -24px var(--shadow);
}
.widget.weather { flex: 1.3; }
button.widget:focus { transform: scale(1.035); background: var(--tile-focus); box-shadow: 0 34px 60px -20px var(--shadow-strong); z-index: 2; }
.w-head { display: flex; justify-content: space-between; align-items: center; font-size: 22px; font-weight: 500; color: var(--text2); }
.pill { font-size: 16px; font-weight: 600; padding: 5px 12px; border-radius: 999px; background: var(--tile); color: var(--text2); border: 1px solid var(--stroke); }

.weather { display: grid; grid-template-columns: 220px 1fr; gap: 0; }
.w-now { padding-right: 22px; border-right: 1px solid var(--stroke); }
.w-temp { display: flex; align-items: center; gap: 10px; margin: 18px 0 8px; }
.w-temp svg { width: 64px; height: 64px; color: var(--text2); }
.w-temp b { font-size: 92px; font-weight: 300; letter-spacing: -.04em; line-height: 1; }
.w-desc { font-size: 25px; font-weight: 500; }
.w-mm { font-size: 19px; color: var(--text2); margin-top: 6px; }
.w-hours { padding-left: 22px; display: flex; flex-direction: column; justify-content: space-between; }
.hours { display: grid; grid-template-columns: repeat(6, 1fr); text-align: center; margin-top: 18px; }
.hours span { display: block; font-size: 20px; color: var(--text2); }
.hours svg { width: 40px; height: 40px; margin: 10px 0 6px; color: var(--text2); }
.hours b { display: block; font-size: 29px; font-weight: 600; letter-spacing: -.02em; }
.hours small { display: block; font-size: 17px; font-weight: 600; color: #4FA3FF; margin-top: 4px; }
.hours small.dry { color: var(--text3); }
.sun-times { display: flex; justify-content: space-around; gap: 12px; font-size: 19px; color: var(--text2); }
.sun-times span { display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.sun-times svg { width: 22px; height: 22px; flex: none; }

.ambi-mid { display: flex; align-items: center; gap: 26px; margin: 20px 0 18px; }
.mini-tv {
  width: 116px; height: 68px; flex: none; border-radius: 9px; background: #15161a; border: 3px solid #26272c;
  box-shadow: -16px 0 26px -2px var(--gl), 16px 0 26px -2px var(--gr), 0 -12px 24px -2px var(--gt), 0 12px 24px -2px var(--gb);
  transition: box-shadow 1s;
}
.bright { flex: 1; display: flex; align-items: center; gap: 12px; }
.bbtn { width: 48px; height: 48px; flex: none; border-radius: 50%; border: 1px solid var(--stroke); background: var(--tile); color: var(--text); font-size: 26px; line-height: 1; }
.bbtn:focus { transform: scale(1.18); background: var(--tile-focus); box-shadow: 0 14px 26px -10px var(--shadow-strong); }
.bar { flex: 1; display: flex; gap: 6px; }
.bar i { flex: 1; height: 10px; border-radius: 5px; background: var(--text3); opacity: .35; }
.bar i.on { background: var(--text); opacity: 1; }
.modes { display: flex; flex-wrap: wrap; gap: 10px; }
.mode { font-size: 18px; font-weight: 500; padding: 10px 17px; border-radius: 999px; border: 1px solid var(--stroke); background: var(--tile); color: var(--text); }
.mode.on { background: var(--accent); color: #fff; border-color: transparent; }
.mode:focus { transform: scale(1.12); box-shadow: 0 14px 26px -10px var(--shadow-strong); }
.mode:not(.on):focus { background: var(--tile-focus); }

#newsList { margin-top: 18px; display: flex; flex-direction: column; gap: 18px; transition: opacity .4s; }
#newsList.out { opacity: 0; }
.n .src { font-size: 16px; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
.n .src em { font-style: normal; font-weight: 500; color: var(--text2); text-transform: none; letter-spacing: 0; }
.n p { margin: 6px 0 0; font-size: 22px; font-weight: 500; line-height: 1.28; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

/* Banners reais dos apps (TV) e destaques com imagem */
.tile.real { background: #1c1d22; }
.tile.real img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.art.img { background-size: cover; background-position: center; background-color: #111; }
.art.img .sil { display: none; }
.poster .art.img .art-title { display: none; }
.ambi-note { margin: 0; font-size: 20px; line-height: 1.35; color: var(--text2); }

.ambi-top { display: flex; gap: 10px; margin-top: 16px; }
.ambi-row { display: flex; align-items: center; gap: 12px; margin-top: 14px; font-size: 19px; color: var(--text2); }
.ambi-row .lbl { width: 100px; }
.ambi-row .bar { flex: 1; }
.ambi-row .num { width: 34px; text-align: right; color: var(--text); font-weight: 600; }
.ambi-row .bbtn { width: 42px; height: 42px; font-size: 24px; }
.panel.wxp { width: 1920px; max-width: none; height: 1080px; max-height: none; border-radius: 0; border: 0; padding: 80px 120px;
  background: linear-gradient(160deg, var(--bg1), var(--bg2)); display: flex; flex-direction: column; justify-content: center; }
.wxp .wxp-top h2 { font-size: 52px; }
.wxp .wxp-hours { margin-top: 10px; }
.wxp-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 30px; }
.wxp-top h2 { display: flex; align-items: center; gap: 10px; }
.wxp-top h2 svg { width: 34px; height: 34px; color: var(--text2); }
.wxp-btns { display: flex; gap: 12px; }
.wxp-now { display: flex; align-items: center; gap: 26px; margin-top: 6px; }
.wxp-now svg { width: 120px; height: 120px; color: var(--text2); }
.wxp-now b { font-size: 140px; font-weight: 200; letter-spacing: -.05em; line-height: 1; }
.wxp-desc { font-size: 34px; font-weight: 500; }
.wxp-mm { font-size: 23px; color: var(--text2); margin-top: 8px; }
.wxp-det { display: grid; grid-template-columns: repeat(5, 1fr); gap: 14px; margin: 26px 0 22px; }
.wxp-det div { background: var(--tile); border-radius: 22px; padding: 16px 22px; font-size: 19px; color: var(--text2); }
.wxp-det b { display: block; font-size: 30px; color: var(--text); font-weight: 600; margin-top: 4px; }
.wxp-hours { display: grid; grid-template-columns: repeat(12, 1fr); text-align: center; padding: 16px 0; border-top: 1px solid var(--stroke); border-bottom: 1px solid var(--stroke); }
.wxp-hours span { display: block; font-size: 19px; color: var(--text2); }
.wxp-hours svg { width: 40px; height: 40px; margin: 10px 0 6px; color: var(--text2); }

  $('#content').style.transform = `translateY(${-scrollY}px)`;
  for (const s of sections()) {
    const top = s.offsetTop, bot = top + s.offsetHeight;
    s.classList.toggle('off', top < scrollY - 10 || bot > scrollY + 1070);
  }
}
function ensureVisible(el) {
  const b = el.closest('#header, .block'); if (!b) return;
  const top = b.offsetTop, bot = top + b.offsetHeight;
  if (top >= scrollY + 40 && bot <= scrollY + 1060 && !b.classList.contains('off')) return;
  let y = top - 150;
  if (b.id === 'header' || y < 300) y = 0;
  scrollTo(y);
}

/* ---------- Navegação por controle remoto ---------- */
function focusEl(el) {
  if (!el) return;
  el.focus({ preventScroll: true });
  if (el.closest('.pscroll')) panelScroll(el);
}
function refocus(act) { focusEl(document.querySelector(`[data-act="${CSS.escape(act)}"]`)); }
const firstHome = () => $('#blocks .f') || $('#header .f');
function candidates() {
  return [...(state.panel ? $('#overlay') : $('#content')).querySelectorAll('.f')];
}
function move(dir) {
  const list = candidates(), cur = document.activeElement;
  if (!list.includes(cur)) { focusEl(state.panel ? list[0] : firstHome()); return; }
  const a = cur.getBoundingClientRect(), ax = a.left + a.width / 2, ay = a.top + a.height / 2;
  let best = null, bs = Infinity;
  for (const e of list) {
    if (e === cur) continue;
    const b = e.getBoundingClientRect(), bx = b.left + b.width / 2, by = b.top + b.height / 2;
    let score;
    if (dir === 'left' || dir === 'right') {
      const d = dir === 'right' ? bx - ax : ax - bx;
      if (d <= 4) continue;
      const gap = Math.max(0, dir === 'right' ? b.left - a.right : a.left - b.right);
      const off = Math.max(0, Math.max(a.top, b.top) - Math.min(a.bottom, b.bottom));
      // Na tela inicial, ← → só andam na mesma fileira: no fim da barra de apps o foco fica parado.
      if (!state.panel && off > 0) continue;
      score = gap + off * 4 + Math.abs(by - ay) * 0.2;
    } else {
      const d = dir === 'down' ? by - ay : ay - by;
      if (d <= 4) continue;
      const gap = Math.max(0, dir === 'down' ? b.top - a.bottom : a.top - b.bottom);
      const off = Math.max(0, Math.max(a.left, b.left) - Math.min(a.right, b.right));
      score = gap + off * 2 + Math.abs(bx - ax) * 0.35;
    }
    if (score < bs) { bs = score; best = e; }
  }
  focusEl(best);
}
function back() {
  if (state.panel === 'keys') closeKeyPicker(false);
  else if (state.moving) dropMove();
  else if (state.panel) closePanel();
  else if (scrollY > 0) focusEl(firstHome());
}

/* Rolagem animada própria, por temporizador: a rolagem suave do CSS e o requestAnimationFrame

  const items = sc.querySelectorAll('.f'), boxOf = f => f.closest('.rw') || f;

/* Janela "Adicionar botões": o serviço ouve o controle e anota cada botão; Voltar encerra a escuta;

const keyPick = { listening: false, list: [], removed: new Set(), timer: null };
function openKeyPicker() {

  keyPick.timer = setInterval(() => {

    const changed = JSON.stringify(list) !== JSON.stringify(keyPick.list) || keyPick.listening !== k.capturing;
    keyPick.list = list; keyPick.listening = k.capturing;

    ? { act: listening ? 'noop' : 'kp:del:' + x.code, icon: 'remote', label: keyName(x), sub: 'Vai mostrar o relógio', end: listening ? '' : 'Remover' }

    ${rows.length ? rows.map(rowHtml).join('') : `<p class="note">${listening ? 'Nenhum botão apertado ainda.' : 'Nenhum botão escolhido.'}</p>`}

    case 'wloc':

/* ---------- Eventos ---------- */
document.addEventListener('keydown', e => {
  const dirs = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
  if (state.dockMove) {
    e.preventDefault();
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') moveDock(e.key === 'ArrowLeft' ? -1 : 1);
    else if (['Enter', 'Escape', 'Backspace'].includes(e.key) && !e.repeat) endDockMove();
    return;
  }
  // OK nos apps (barra e Todos os apps): toque curto abre, segurado abre a opção de mover ou o menu do app.
  if (e.key === 'Enter' && document.activeElement && document.activeElement.matches('#dock .tile, .gapp')) {
    e.preventDefault();
    const el = document.activeElement;
    if (!press || press.el !== el) press = { el, t: Date.now(), long: false };
    else if (!press.long && Date.now() - press.t > 550) { press.long = true; longPress(el); }
    return;
  }
  if (e.target.tagName === 'INPUT') {
    if (e.key === 'Enter') { e.preventDefault(); searchCity(e.target.value); return; }
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); e.target.blur(); move(dirs[e.key]); return; }
    if (e.key === 'Escape') { e.preventDefault(); back(); return; }
    return;   // letras, números e ← → ficam com o campo
  }
  if (state.moving) {
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); moveItem(e.key === 'ArrowUp' ? -1 : 1); return; }
    if (['Enter', ' ', 'Escape', 'Backspace'].includes(e.key)) { e.preventDefault(); dropMove(); return; }
    if (dirs[e.key]) { e.preventDefault(); return; }
  }
  if (e.key === 'h' || e.key === 'H') { osdKeyDown(e); return; }
  if (state.appOpen) {
    if (e.key === 'Escape' || e.key === 'Backspace') closeApp();
    if (e.key !== 't' && e.key !== 'T' && e.key !== 'f' && e.key !== 'F') { e.preventDefault(); return; }
  }
  if (dirs[e.key]) { e.preventDefault(); move(dirs[e.key]); }
  else if (e.key === 'Escape' || e.key === 'Backspace') { e.preventDefault(); back(); }
  else if (e.key === 't' || e.key === 'T') cycleTheme();
  else if (e.key === 'f' || e.key === 'F') { toggleFrame(); if (state.panel === 'custom' && state.cat === 'aparencia') { refreshPanel(); refocus('tog:frame'); } }
});

/* ---------- Destaques reais (TMDB) ----------
   O que está em alta na semana, só dos serviços que a TV tem e disponível no Brasil.
   Lógica adaptada do Free My TV (MIT): https://github.com/simbasjungles/free-my-tv */
const TMDB_KEY = ((TV && TV.tmdbKey()) || store.get('tmdbKey', '') || '').trim();
const SERVICES = [['netflix', 'com.netflix.ninja', 'Netflix'], ['prime video', 'com.amazon.amazonvideo.livingroom', 'Prime Video'],
  ['disney', 'com.disney.disneyplus', 'Disney+'], ['globoplay', 'com.globo.globotv', 'Globoplay'], ['max', 'com.wbd.stream', 'Max'],
  ['apple tv', 'com.apple.atve.androidtv.appletv', 'Apple TV'], ['crunchyroll', 'com.crunchyroll.crunchyroid', 'Crunchyroll'], ['paramount', 'com.cbs.ott', 'Paramount+']];
const GENRES_PT = { 'Action & Adventure': 'Ação e Aventura', 'Sci-Fi & Fantasy': 'Ficção científica e Fantasia', 'War & Politics': 'Guerra e Política', Kids: 'Infantil', Soap: 'Novela' };
const serviceOf = name => { const n = name.toLowerCase(); return SERVICES.find(s => s[0] === 'max' ? /\bmax\b/.test(n) : n.includes(s[0])); };
function tmdb(path) {
  const bearer = TMDB_KEY.startsWith('eyJ');   // token de leitura (v4) ou chave da API (v3)
  const url = 'https://api.themoviedb.org/3' + path + (bearer ? '' : (path.includes('?') ? '&' : '?') + 'api_key=' + encodeURIComponent(TMDB_KEY));
  return getText(url, bearer ? TMDB_KEY : null).then(JSON.parse);
}
async function tmdbPick(o, kind) {
  const d = await tmdb(`/${kind}/${o.id}?language=pt-BR&append_to_response=watch/providers`);
  const flat = ((((d['watch/providers'] || {}).results || {}).BR) || {}).flatrate || [];
  const svc = flat.map(f => serviceOf(f.provider_name)).find(x => x && avail(x[1]));
  if (!svc) return null;
  const parts = [kind === 'tv' ? 'Série' : 'Filme'];
  if (d.genres && d.genres[0]) parts.push(GENRES_PT[d.genres[0].name] || d.genres[0].name);
  if (kind === 'movie' && d.runtime) parts.push(d.runtime >= 60 ? `${Math.floor(d.runtime / 60)}h${String(d.runtime % 60).padStart(2, '0')}` : d.runtime + ' min');
  if (kind === 'tv' && d.number_of_seasons) parts.push(d.number_of_seasons === 1 ? '1 temporada' : d.number_of_seasons + ' temporadas');
  const img = 'https://image.tmdb.org/t/p/';
  return { t: d.title || d.name, meta: parts.join(' · '), app: svc[2], appId: svc[1], tmdbId: d.id, kind, c: ['#101820', '#2a3a55', '#e0b070'],
    back: d.backdrop_path && img + 'w1280' + d.backdrop_path, poster: d.poster_path && img + 'w500' + d.poster_path };
}
const HERO_MAX = 12;
async function tmdbTop(kind, batch = 0) {
  const pages = await Promise.all([1, 2].map(p => tmdb(`/trending/${kind}/week?language=pt-BR&page=${batch * 2 + p}`)));
  const hot = pages.flatMap(p => p.results).filter(o => o.backdrop_path && o.media_type !== 'person').slice(0, 36);
  const picks = await Promise.all(hot.map(o => tmdbPick(o, o.media_type || kind).catch(() => null)));
  return picks.filter(Boolean).slice(0, HERO_MAX);
}
async function loadHero() {
  if (!TMDB_KEY) return;
  const cached = store.get('hero', null);
  let data = cached && cached.v === 2 && Date.now() - cached.at < 3 * 3600e3 ? cached.data : null;
  if (!data) {
    try {
      const [explorar, filmes, series] = await Promise.all([tmdbTop('all'), tmdbTop('movie'), tmdbTop('tv')]);
      if (explorar.length < 3 || filmes.length < 3 || series.length < 3) return;
      data = { explorar, filmes, series };
      store.set('hero', { v: 2, at: Date.now(), data });
    } catch (e) { return; }
  }
  Object.assign(CONTENT, data);
  heroReal = true;
  renderHomeKeepFocus();
}

/* "Mais títulos": troca a aba atual pelos próximos 12 em alta; quando acabam, volta ao começo. */
const heroBatch = {}; let heroLoading = false;
async function moreHero() {
  if (heroLoading) return;
  const tab = state.tab, kind = { explorar: 'all', filmes: 'movie', series: 'tv' }[tab];
  heroLoading = true; renderHero(); refocus('heromore');
  let next = (heroBatch[tab] || 0) + 1, list = [];
  try { list = await tmdbTop(kind, next); } catch (e) {}
  if (!list.length) { next = 0; try { list = await tmdbTop(kind, 0); } catch (e) {} }
  heroLoading = false;
  if (list.length) { heroBatch[tab] = next; CONTENT[tab] = list; }
  if (state.tab !== tab) return;
  renderHero();
  focusEl($('#hero .f'));
  toast(list.length ? (next ? `Mais ${list.length} títulos` : 'De volta aos primeiros títulos') : 'Não consegui buscar mais títulos');
}

/* Link do título dentro do app do serviço, no Brasil, pelo JustWatch (a mesma fonte de "onde assistir" do TMDB).
   Confere o ID do TMDB para não abrir um homônimo. Sem link, abre só o app. */
const SERVICE_HOSTS = { 'com.netflix.ninja': /netflix\.com/, 'com.amazon.amazonvideo.livingroom': /primevideo\.com|amazon\./, 'com.disney.disneyplus': /disneyplus\.com/,
  'com.wbd.stream': /max\.com|hbomax\.com/, 'com.apple.atve.androidtv.appletv': /tv\.apple\.com/, 'com.globo.globotv': /globo/, 'com.crunchyroll.crunchyroid': /crunchyroll/ };
async function deepLink(it) {
  if (it.deep !== undefined) return it.deep;
  const q = 'query S($q:String!,$c:Country!,$l:Language!){popularTitles(country:$c,first:5,filter:{searchQuery:$q}){edges{node{'
    + 'content(country:$c,language:$l){externalIds{tmdbId}} offers(country:$c,platform:WEB){monetizationType standardWebURL}}}}}';
  try {
    const j = JSON.parse(await getText('https://apis.justwatch.com/graphql', null, JSON.stringify({ query: q, variables: { q: it.t, c: 'BR', l: 'pt' } })));
    const node = j.data.popularTitles.edges.map(e => e.node).find(n => String(n.content.externalIds.tmdbId) === String(it.tmdbId));
    const offer = node && node.offers.find(o => ['FLATRATE', 'FREE', 'ADS'].includes(o.monetizationType) && (SERVICE_HOSTS[it.appId] || /$^/).test(o.standardWebURL));
    it.deep = offer ? offer.standardWebURL : null;
  } catch (e) { it.deep = null; }
  return it.deep;
}
async function openPick(it) {
  if (!TV || !it.tmdbId) return openApp(it.appId ? appById(it.appId) : ALL_APPS.find(x => x.name === it.app), it.t);
  if (!avail(it.appId)) { toast(`${it.app} não está instalado na TV`); return; }
  toast(`Abrindo ${it.t} no ${it.app}…`);
  const url = await deepLink(it);
  url ? TV.openTitle(url, it.appId) : TV.openApp(it.appId);
}

/* Chamados pelo app Android: Home com o launcher já aberto, e volta de outro app. */
window.tvHome = () => { if (state.moving) dropMove(); if (state.panel) closePanel(); renderHome(); focusEl(firstHome()); };
window.tvResume = () => { loadDevices(); if (!state.panel) { syncApps(); renderHomeKeepFocus(); } };

loadDevices();
applyLook(); applyTheme(); renderHome(); applyGlow(); layout(); restartNews();
focusEl(firstHome());
loadWeather(); loadNews(); loadHero(); syncOsd();
// Cabo HDMI ligado/desligado e mudança de rede aparecem sozinhos.
if (TV) setInterval(() => {
  if (!loadDevices() || state.panel) return;
  const a = document.activeElement && document.activeElement.dataset.act;
  renderControls(); if (a) refocus(a);
}, 15000);
